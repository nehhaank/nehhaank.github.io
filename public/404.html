<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost &amp; found · Neha NK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Caveat:wght@600&family=DM+Mono&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3e9d6; color: #2e241c; font-family: "Bricolage Grotesque", system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      .box { width: 200px; height: 140px; margin: 0 auto 32px; border-radius: 6px; background: #c9a273 repeating-linear-gradient(90deg, rgba(110,70,30,.07) 0 2px, transparent 2px 8px); box-shadow: inset 0 0 0 2px rgba(120,80,40,.22), 0 2px 0 #9f784c, 0 18px 28px -16px rgba(60,35,10,.55); display: grid; place-items: center; rotate: -3deg; position: relative; }
      .box::before { content: ""; position: absolute; left: -12px; top: 14px; width: 90px; height: 24px; background: rgba(251,178,43,.85); rotate: -30deg; }
      .label { background: #fbf6ec; padding: 8px 12px; font: 13px/1.5 "DM Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
      h1 { font-size: clamp(2.6rem, 8vw, 5rem); letter-spacing: -.05em; line-height: .95; margin: 0 0 12px; }
      p { font: 600 1.6rem "Caveat", cursive; color: #85593a; margin: 0 0 28px; }
      a { display: inline-block; padding: 14px 26px; border-radius: 999px; background: #fbb22b; color: #2e241c; font-weight: 800; text-decoration: none; box-shadow: inset -3px -5px 8px rgba(40,20,5,.2), 0 10px 16px -8px rgba(60,30,10,.45); }
    </style>
  </head>
  <body>
    <main>
      <div class="box"><span class="label">lost &amp; found<br />no. 404</span></div>
      <h1>This page wandered off.</h1>
      <p>it’s not in the box either</p>
      <a href="/">back to the workbench</a>
    </main>
  </body>
</html>
